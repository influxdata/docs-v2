name: Verify AI artifacts

# Pre-merge gate for the Markdown-twin and AI-discovery artifact set.
#
# Why this builds the site again instead of reusing another job:
#
#   - CircleCI's `build` job generates the same artifacts, but for PRs it
#     runs `build:md --only-changed` and skips `build:llms-full` and
#     `check:md-coherence` entirely (master-only). A partial .md set would
#     false-positive those checks, so they can only run against a full
#     build. This job is that full build. Do NOT "optimize" the
#     `build:md` call below to `--only-changed` — it would silently
#     reduce the checks below to near-noise.
#   - `pr-render-check.yml` builds the site on every PR, but with
#     `build-api-docs: false` and no API pages, and it runs unfiltered on
#     every PR. Folding these steps in would pay the API-docs and
#     Markdown-generation cost on PRs that touch none of the paths below.
#
# `hugo-base-url` is the production URL on purpose: the artifacts embed
# absolute URLs, so this verifies the exact strings production emits.

on:
  pull_request:
    paths:
      - 'content/**'
      - 'data/**'
      - 'layouts/**'
      - 'config/**'
      - 'api-docs/**'
      - 'openapi/**'
      - 'scripts/build-ai-artifacts.js'
      - 'scripts/build-llm-markdown.js'
      - 'scripts/build-llms-full-txt.js'
      - 'scripts/check-jsonld-links.js'
      - 'scripts/check-md-alternate-coherence.js'
      - 'scripts/__tests__/check-jsonld-links.test.mjs'
      - 'scripts/__tests__/markdown-completeness.test.mjs'
      - 'scripts/lib/**'
      - 'scripts/rust-markdown-converter/**'
      - '.github/actions/build-docs-site/**'
      - '.github/actions/setup-docs-env/**'
      - '.github/workflows/pr-ai-artifacts-check.yml'
      - 'package.json'
      - 'yarn.lock'
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# A full site build per push adds up fast; supersede in-flight runs.
concurrency:
  group: pr-ai-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify AI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup docs environment
        env:
          CYPRESS_INSTALL_BINARY: 0
        uses: ./.github/actions/setup-docs-env

      # Unit-test the checker before spending five minutes building a site
      # for it to scan.
      - name: Unit-test the JSON-LD checker
        run: yarn test:jsonld-links

      - name: Build API docs and Hugo site
        uses: ./.github/actions/build-docs-site
        with:
          build-rust: 'true'
          # Explicit even though it is the action default: API reference
          # pages are gitignored and generated from the OpenAPI specs, and
          # 234 of the ~4990 Markdown twins live under /api/. Setting this
          # to false silently drops those pages from every check below.
          # pr-render-check.yml disables API docs, and pr-preview.yml
          # builds them but verifies nothing, so this is the only
          # pre-merge check that covers API-page twins and JSON-LD.
          build-api-docs: 'true'
          hugo-base-url: 'https://docs.influxdata.com/'
          hugo-gc: 'true'
          hugo-quiet: 'true'

      - name: Generate AI discovery artifacts and Markdown twins
        run: |
          yarn build:ai-artifacts --public-dir public
          yarn build:md --public-dir public
          yarn build:llms-full --public-dir public

      - name: Verify Markdown artifacts
        run: |
          yarn check:md-coherence --public-dir public
          PUBLIC_DIR=public yarn test:markdown-completeness

      - name: Verify JSON-LD entity links
        run: yarn check:jsonld-links --public-dir public
