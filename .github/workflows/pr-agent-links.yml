name: Agent instruction links

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '.agents/**/*.md'
      - '.claude/rules/**/*.md'
      - '.github/instructions/**/*.md'
      - 'PLATFORM_REFERENCE.md'
      - '.github/scripts/site-change-scope.mjs'
      - '.github/workflows/pr-agent-links.yml'

permissions:
  contents: read

jobs:
  links:
    name: Check links in agent source files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --version

      - name: Check relative file links and external URLs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/site-change-scope.mjs --links
