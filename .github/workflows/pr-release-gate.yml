name: Release Gate

# Blocking check for gated version bumps in data/products.yml.
#
# .ci/release-gates.yml names, per product, the version field that publishes a
# release and the GitHub team whose approving review is the greenlight. When a
# pull request changes one of those fields, this job fails until a member of
# that team has an approving review on the pull request.
#
# Why a review and not a label: a label can be applied by whoever opens the PR,
# so it guards against forgetting, not against being wrong. The failures this
# gate exists for were the docs author reading an earlier release signal
# (release candidate to specific customers, Docker publish, Cloud deployment)
# as the greenlight. Only the release team knows, so only their approval counts.
#
# Design notes:
#   - No `paths:` filter. A required status check that is skipped by a path
#     filter leaves the PR stuck at "Expected". Every PR runs this job; PRs that
#     do not touch data/products.yml exit in the first step without installing
#     anything.
#   - Runs on pull_request_review too, so an approval or dismissal re-evaluates
#     the gate without a new push.
#   - Team membership is resolved with RELEASE_GATE_ORG_TOKEN (a token with
#     read:org). Only the teams for triggered gates are resolved, so PRs that
#     bump ungated products never need the token. If a triggered gate's team
#     cannot be resolved (missing secret, fork PR, wrong slug), the check fails
#     closed and says so.
#   - Turn on "Dismiss stale pull request approvals when new commits are
#     pushed" in branch protection so a push after approval re-closes the gate.
#   - Make this check required in branch protection once it has passed on a
#     test PR. The job name below is the status check name.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not the merge ref, so the diff below is the PR's own
          # change. Works the same for pull_request and pull_request_review.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      # Fast path: most PRs never touch data/products.yml. Fetch the base
      # commit only (not the whole history) and exit before Node is installed.
      - name: Detect products.yml change
        id: detect
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -qx 'data/products.yml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Release gate"
              echo
              echo "\`data/products.yml\` not changed; nothing to gate."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true'
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: yarn install --frozen-lockfile

      - name: Verify the checker itself
        if: steps.detect.outputs.changed == 'true'
        run: node --test .ci/scripts/check-release-gate.test.js

      # Which gates does this diff trigger? Prints team slugs, or nothing.
      - name: Find triggered gates
        if: steps.detect.outputs.changed == 'true'
        id: gates
        run: |
          git show "$BASE_SHA:data/products.yml" > /tmp/products-old.yml
          node .ci/scripts/check-release-gate.js \
            --base /tmp/products-old.yml --head data/products.yml \
            --print-teams > /tmp/teams.txt
          echo "Triggered gate teams:"
          cat /tmp/teams.txt
          if [[ -s /tmp/teams.txt ]]; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pull request reviews
        if: steps.gates.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[]' | jq -s '.' > /tmp/reviews.json
          echo "$(jq length /tmp/reviews.json) review(s) fetched"

      # One JSON object: { "org/slug": [logins] | null }. null when the team
      # cannot be read; the checker treats that as fail-closed.
      - name: Resolve release team members
        if: steps.gates.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GATE_ORG_TOKEN }}
        run: |
          echo '{}' > /tmp/members.json
          while IFS= read -r team; do
            [[ -z "$team" ]] && continue
            org="${team%%/*}"
            slug="${team#*/}"
            if [[ -z "$GH_TOKEN" ]]; then
              echo "::warning::RELEASE_GATE_ORG_TOKEN is not set; cannot resolve $team"
              members='null'
            elif members=$(gh api --paginate "orgs/${org}/teams/${slug}/members" \
                --jq '.[].login' 2>/tmp/gh-err.txt | jq -R -s 'split("\n") | map(select(length > 0))'); then
              echo "$team: $(jq length <<< "$members") member(s)"
            else
              echo "::warning::Could not read members of $team: $(cat /tmp/gh-err.txt)"
              members='null'
            fi
            jq --arg t "$team" --argjson m "$members" '. + {($t): $m}' \
              /tmp/members.json > /tmp/members.next.json
            mv /tmp/members.next.json /tmp/members.json
          done < /tmp/teams.txt

      - name: Evaluate release gates
        if: steps.gates.outputs.triggered == 'true'
        run: |
          set +e
          node .ci/scripts/check-release-gate.js \
            --base /tmp/products-old.yml --head data/products.yml \
            --reviews /tmp/reviews.json --members /tmp/members.json \
            | tee /tmp/report.md
          status=${PIPESTATUS[0]}
          set -e
          grep -v '^::' /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report ungated bump
        if: >-
          steps.detect.outputs.changed == 'true' &&
          steps.gates.outputs.triggered == 'false'
        run: |
          {
            echo "## Release gate"
            echo
            echo "\`data/products.yml\` changed, but no gated version field did."
          } >> "$GITHUB_STEP_SUMMARY"
