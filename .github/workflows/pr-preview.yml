name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review, edited]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'assets/**'
      - 'data/**'
      - 'api-docs/**'
      - 'openapi/**'
      - '.github/workflows/pr-preview.yml'
      - '.github/scripts/preview-comment.js'
      - '.github/scripts/test-preview-isolation.js'
      - '.github/actions/build-docs-site/**'
      - '.github/actions/setup-docs-env/**'
      - '.s3deploy.yml'
      # Scoped agent instructions do not change the published site.
      # Keep exclusions after positive patterns so mixed content PRs still run.
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'

permissions: {}

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # Skip draft PRs and check for re-runs that would overwrite successful status
  check-draft:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      pull-requests: read
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT) || 1;

            // Check for draft PR
            if (pr?.draft) {
              core.info('Skipping draft PR');
              core.setOutput('should-run', 'false');
              return;
            }

            // For 'edited' events, skip if only the title changed (body unchanged)
            if (context.payload.action === 'edited' && !context.payload.changes?.body) {
              core.info('PR title edited (body unchanged) - skipping');
              core.setOutput('should-run', 'false');
              return;
            }

            // First attempts always proceed (after draft check)
            if (runAttempt === 1) {
              core.setOutput('should-run', 'true');
              return;
            }

            // This is a re-run. Check if jobs would actually run or skip.
            const isFork = pr?.head?.repo?.full_name !== pr?.base?.repo?.full_name;
            const isClosed = context.payload.action === 'closed';

            // For preview job: needs non-fork, non-closed
            // For cleanup job: needs closed
            // For fork-notice: needs fork, non-closed
            // At least one job would run in most cases unless PR state changed
            const previewWouldRun = !isFork && !isClosed;
            const cleanupWouldRun = isClosed;
            const forkNoticeWouldRun = isFork && !isClosed;
            const anyJobWouldRun = previewWouldRun || cleanupWouldRun || forkNoticeWouldRun;

            if (anyJobWouldRun) {
              core.info('Re-run would execute jobs - proceeding');
              core.setOutput('should-run', 'true');
              return;
            }

            // Jobs would skip. Check for existing successful runs.
            core.info('Re-run would skip jobs - checking for existing successful runs');

            try {
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                per_page: 100,
              });

              const previewJobs = ['check-draft', 'preview-build', 'preview-deploy', 'preview-comment', 'cleanup', 'fork-notice'];
              const successfulOtherRuns = checkRuns.check_runs.filter(cr => {
                const isOurJob = previewJobs.includes(cr.name);
                const isSuccessful = cr.conclusion === 'success';
                const fromDifferentRun = cr.html_url && !cr.html_url.includes(`/runs/${context.runId}/`);
                return isOurJob && isSuccessful && fromDifferentRun;
              });

              if (successfulOtherRuns.length > 0) {
                core.info(`Found ${successfulOtherRuns.length} successful runs - aborting to preserve status`);
                core.setOutput('should-run', 'false');
                return;
              }
            } catch (error) {
              core.warning(`Could not check existing runs: ${error.message}`);
            }

            core.info('No existing successful runs - proceeding');
            core.setOutput('should-run', 'true');

  # Notify fork PRs that preview is not available
  fork-notice:
    needs: check-draft
    if: |
      needs.check-draft.outputs.should-run == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post fork notice comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const marker = '<!-- pr-preview-fork-notice -->';
            const existing = comments.find(c => c.body.includes(marker));

            if (!existing) {
              const timestamp = new Date().toISOString().replace('T', ' ').split('.')[0] + ' UTC';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\n## 📦 PR Preview — Preview Bot\n\n| Status | Details |\n|--------|----------|\n| **Result** | ⏭️ NOT AVAILABLE |\n| **Reason** | Fork PR (no write access to staging) |\n| **Checked** | ${timestamp} |\n\n### Local Preview\n\nPR previews are not available for pull requests from forks, since the deploy needs write access to the staging bucket.\n\nTo preview your changes locally, run:\n\`\`\`bash\nnpx hugo server\n\`\`\`\n\nOnce merged, your changes will be visible on the production site.`
              });
            }

  # Build on a runner without deployment capability.
  preview-build:
    needs: check-draft
    # Fork previews remain unavailable.
    if: |
      needs.check-draft.outputs.should-run == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: none
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      changed-pages: ${{ steps.detect.outputs.changed-pages }}
      build-time: ${{ steps.build.outputs.build-time }}
      upload-start: ${{ steps.upload-start.outputs.ts }}
    env:
      PREVIEW_BASE_URL: https://test2.docs.influxdata.com/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Verify build credential isolation
        run: |
          for variable in ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_WEB_IDENTITY_TOKEN_FILE; do
            if [ -n "${!variable:-}" ]; then
              printf 'Build job received deployment capability: %s\n' "$variable" >&2
              exit 1
            fi
          done
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Rust markdown converter version
        run: |
          VERSION=$(node -p "require('./scripts/rust-markdown-converter/package.json').version")
          echo "RUST_MARKDOWN_CONVERTER_VERSION=v$VERSION" >> "$GITHUB_ENV"

      - name: Download pinned Rust markdown converter
        id: rust-converter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_DIR=scripts/rust-markdown-converter
          RELEASE=rust-markdown-converter-${RUST_MARKDOWN_CONVERTER_VERSION}
          BINARY=rust-markdown-converter-linux-x86_64-gnu.node
          LOADER=rust-markdown-converter-loader.js

          if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "Pinned converter release $RELEASE is unavailable; using the build cache."
            echo 'prebuilt=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release download "$RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$BINARY" \
            --pattern "$LOADER" \
            --pattern checksums.txt \
            --dir "$ASSET_DIR" \
            --clobber
          (
            cd "$ASSET_DIR"
            grep "  $BINARY$" checksums.txt | sha256sum --check --status
            grep "  $LOADER$" checksums.txt | sha256sum --check --status
            mv "$BINARY" index.linux-x64-gnu.node
            mv "$LOADER" index.js
            rm checksums.txt
          )
          echo 'RUST_MARKDOWN_CONVERTER_PREBUILT=true' >> "$GITHUB_ENV"
          echo 'prebuilt=true' >> "$GITHUB_OUTPUT"

      - name: Cache Rust markdown converter build
        if: steps.rust-converter.outputs.prebuilt != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/rust-markdown-converter/target
          key: >-
            rust-markdown-converter-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('scripts/rust-markdown-converter/rust-toolchain.toml') }}-
            ${{ hashFiles('scripts/rust-markdown-converter/Cargo.lock') }}
          restore-keys: |
            rust-markdown-converter-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('scripts/rust-markdown-converter/rust-toolchain.toml') }}-

      - name: Setup docs environment
        uses: ./.github/actions/setup-docs-env

      - name: Verify preview credential boundary
        run: node --test .github/scripts/test-preview-isolation.js

      - name: Fetch current PR body
        id: fetch-pr-body
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const fs = require('fs');
            const bodyFile = `${process.env.RUNNER_TEMP}/pr-body.txt`;
            fs.writeFileSync(bodyFile, pr.body || '');
            core.exportVariable('PR_BODY_FILE', bodyFile);

      - name: Detect changed pages (for comment links)
        id: detect
        continue-on-error: true # best-effort; never blocks the full-site deploy
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node .github/scripts/detect-preview-pages.js

      - name: Start build timer
        id: timer-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build docs site
        # API reference pages under content/{product}/api/ are gitignored
        # and generated at build time from OpenAPI specs. Without this
        # step, Hugo builds a site with no API pages and preview URLs for
        # any /api/ route 404 (see #7123 for the symptom).
        # Uses the canonical build-docs-site action for PR/prod parity.
        # hugo-environment: production (not pr-preview) so the preview
        # faithfully represents what production will serve: fingerprinted
        # + SRI JS, minification, real GA/GTM, and the __tests__/test_only
        # exclusions production applies. CI checks that need those fixtures
        # (Cypress, render checks) build their own copy in their own job
        # with the testing/development environment and never consume this
        # deployed preview.
        uses: ./.github/actions/build-docs-site
        with:
          hugo-environment: production
          hugo-gc: 'true'
          hugo-log-level: info
          hugo-base-url: ${{ env.PREVIEW_BASE_URL }}

      - name: Keep links within the PR preview
        # Root-relative links in content and templates bypass Hugo's baseURL.
        run: node .ci/scripts/check-preview-links.mjs public "$PREVIEW_BASE_URL" --rewrite

      - name: Record build time
        id: build
        run: |
          DURATION=$(( $(date +%s) - ${{ steps.timer-start.outputs.ts }} ))
          echo "build-time=${DURATION}s" >> "$GITHUB_OUTPUT"

      - name: Prepare preview artifact
        run: |
          mkdir -p "$RUNNER_TEMP/preview-artifact"
          cp -a public "$RUNNER_TEMP/preview-artifact/public"
          cp .s3deploy.yml "$RUNNER_TEMP/preview-artifact/.s3deploy.yml"

      - name: Start artifact transfer timer
        id: upload-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Upload preview artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-preview-${{ github.event.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview-deploy:
    needs: preview-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      STAGING_BUCKET: ${{ secrets.STAGING_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CF_DISTRIBUTION_ID: ${{ secrets.STAGING_CF_DISTRIBUTION_ID }}
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.preview-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/preview-artifact

      - name: Record artifact transfer time
        env:
          UPLOAD_START: ${{ needs.preview-build.outputs.upload-start }}
        run: |
          if ! [[ "$UPLOAD_START" =~ ^[0-9]+$ ]]; then
            echo "Invalid artifact transfer timestamp" >&2
            exit 1
          fi
          DURATION=$(( $(date +%s) - UPLOAD_START ))
          echo "Preview artifact upload, scheduling, and download: ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Install checksum-verified s3deploy
        env:
          S3DEPLOY_VERSION: '2.11.0'
          S3DEPLOY_VERSION_HASH: 'd3566a6a56735ea5710cf22c35f8f411164e6efc22ded98743a1d7a5a21c740e'
        run: |
          mkdir -p "$RUNNER_TEMP/s3deploy"
          cd "$RUNNER_TEMP/s3deploy"
          ARCHIVE="s3deploy_${S3DEPLOY_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/bep/s3deploy/releases/download/v${S3DEPLOY_VERSION}/${ARCHIVE}" \
            --output "$ARCHIVE"
          echo "$S3DEPLOY_VERSION_HASH  $ARCHIVE" | sha256sum --check --status
          tar -xzf "$ARCHIVE" s3deploy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PR_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pr-preview-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true

      - name: Deploy full site to S3 preview prefix
        # The artifact supplies static files and declarative header configuration.
        # No repository scripts or dependencies run on this runner.
        run: |
          "$RUNNER_TEMP/s3deploy/s3deploy" \
            -source="$RUNNER_TEMP/preview-artifact/public/" \
            -config="$RUNNER_TEMP/preview-artifact/.s3deploy.yml" \
            -bucket="$STAGING_BUCKET" \
            -region="$AWS_REGION" \
            -path "pr-preview/pr-${PR_NUMBER}" \
            -max-delete 50000 \
            -v

      - name: Invalidate CloudFront preview prefix
        # The staging distribution caches stale content and initial 404s.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths "/pr-preview/pr-${PR_NUMBER}/*"

  preview-comment:
    needs: [preview-build, preview-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: none
    env:
      PREVIEW_BASE_URL: https://test2.docs.influxdata.com/pr-preview/pr-${{ github.event.number }}/
      CHANGED_PAGES: ${{ needs.preview-build.outputs.changed-pages }}
      BUILD_TIME: ${{ needs.preview-build.outputs.build-time }}
    steps:
      - name: Checkout trusted comment helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/preview-comment.js
            package.json
          sparse-checkout-cone-mode: false

      - name: Post success comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { upsertPreviewComment } = await import('${{ github.workspace }}/.github/scripts/preview-comment.js');
            let pages = [];
            try {
              pages = JSON.parse(process.env.CHANGED_PAGES);
            } catch {}
            await upsertPreviewComment(github, context, {
              status: 'success',
              previewUrl: process.env.PREVIEW_BASE_URL,
              pages,
              buildTime: process.env.BUILD_TIME,
              prNumber: context.issue.number
            });

  # Cleanup on PR close
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PR_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Delete preview from S3
        run: |
          aws s3 rm "s3://${{ secrets.STAGING_BUCKET }}/pr-preview/pr-${{ github.event.number }}/" --recursive
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.STAGING_CF_DISTRIBUTION_ID }}" \
            --paths "/pr-preview/pr-${{ github.event.number }}/*"

      - name: Delete preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const comment = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.body?.includes('<!-- pr-preview-comment -->')
            );
            if (comment) {
              await github.rest.issues.deleteComment({
                ...context.repo,
                comment_id: comment.id,
              });
            }
