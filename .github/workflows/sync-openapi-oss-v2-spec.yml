name: Sync InfluxDB OSS v2 API spec

on:
  schedule:
    # Run every Monday at 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-openapi-oss-v2-spec
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout docs-v2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Sync InfluxDB OSS v2 API spec
        working-directory: api-docs
        run: bash getswagger.sh v2

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          branch: sync/openapi-oss-v2-spec
          commit-message: 'sync(api): update InfluxDB OSS v2 spec'
          title: 'sync(api): update InfluxDB OSS v2 spec'
          body: |
            Automated weekly sync from
            `influxdata/openapi/docs-release/influxdb-oss/contracts/ref/oss.yml`.

            Before merging, confirm that the API changes are available in a
            released InfluxDB OSS v2 version and inspect the rendered API
            reference:

            ```sh
            bash api-docs/generate-api-docs.sh
            ```
          labels: sync
