name: Sync InfluxDB v2 API specs

on:
  schedule:
    # Run every Monday at 06:30 UTC.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-openapi-v2-specs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout docs-v2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Sync InfluxDB v2 API specs
        working-directory: api-docs
        run: |
          bash getswagger.sh cloud-v2
          bash getswagger.sh v2

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          branch: sync/openapi-v2-specs
          commit-message: 'sync(api): update InfluxDB v2 specs'
          title: 'sync(api): update InfluxDB v2 specs'
          body: |
            Automated weekly sync from `influxdata/openapi`.

            ## What changed

            Regenerates the InfluxDB Cloud v2 and InfluxDB OSS v2 API specs.

            ## Sources

            - Cloud v2: `master/contracts/ref/cloud.yml`
            - OSS v2: `docs-release/influxdb-oss/contracts/ref/oss.yml`

            ## Verification

            Generated with:

            ```sh
            cd api-docs
            bash getswagger.sh cloud-v2
            bash getswagger.sh v2
            ```

            Before merging, review the generated diff and run
            `bash api-docs/generate-api-docs.sh` to inspect the rendered API
            reference.
          labels: sync
