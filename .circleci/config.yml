version: 2.1
jobs:
  verify-branch-denial:
    docker:
      - image: cimg/aws:2026.09.1
    environment:
      AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::056065491910:role/circleci-docs-v2-deploy"
    steps:
      - run:
          name: Verify AWS rejects a non-master branch
          command: |
            set +x
            set -eu
            if [ "$CIRCLE_BRANCH" = "master" ]; then
              echo "FAIL: this check must run on a non-master branch" >&2
              exit 1
            fi
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            if [ -z "${CIRCLE_OIDC_TOKEN_V3:-}" ]; then
              echo "FAIL: CircleCI did not supply a V3 OIDC token" >&2
              exit 1
            fi
            if aws sts assume-role-with-web-identity \
              --region "$REGION" \
              --role-arn "$AWS_DEPLOY_ROLE_ARN" \
              --role-session-name "docs-v2-denial-${CIRCLE_BUILD_NUM}" \
              --web-identity-token "$CIRCLE_OIDC_TOKEN_V3" \
              --duration-seconds 900 \
              --output json > /dev/null 2> /tmp/docs-oidc-denial-error; then
              echo "FAIL: a non-master branch assumed the production role" >&2
              exit 1
            fi
            if ! grep -q '(AccessDenied)' /tmp/docs-oidc-denial-error; then
              cat /tmp/docs-oidc-denial-error >&2
              echo "FAIL: expected AccessDenied, received a different error" >&2
              exit 1
            fi
            echo "PASS: AWS rejected the non-master branch with AccessDenied."
  verify-no-context-tokens:
    docker:
      - image: cimg/aws:2026.09.1
    steps:
      - run:
          name: Verify a context-free job receives no OIDC tokens
          command: |
            set +x
            set -eu
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            for token_name in CIRCLE_OIDC_TOKEN CIRCLE_OIDC_TOKEN_V2 CIRCLE_OIDC_TOKEN_V3; do
              if [ -n "${!token_name:-}" ]; then
                echo "INFO: $token_name is present"
              else
                echo "INFO: $token_name is absent"
              fi
            done
            if [ -n "${CIRCLE_OIDC_TOKEN:-}${CIRCLE_OIDC_TOKEN_V2:-}${CIRCLE_OIDC_TOKEN_V3:-}" ]; then
              echo "FAIL: a job without a context received an OIDC token" >&2
              exit 1
            fi
            echo "PASS: a job without a context receives no OIDC token variables."
            if command -v circleci > /dev/null 2>&1; then
              if circleci run oidc get --v3 > /dev/null 2> /tmp/docs-oidc-no-context-error; then
                echo "FAIL: a job without a context minted a V3 OIDC token" >&2
                exit 1
              fi
              echo "INFO: CircleCI CLI could not mint a V3 token without a context."
            else
              echo "INFO: CircleCI CLI is not installed; CLI minting was not checked."
            fi
workflows:
  oidc-branch-denial:
    jobs:
      - verify-branch-denial:
          context: docs-deploy
          filters:
            branches:
              only:
                - test/circleci-oidc-denial-20261102
      - verify-no-context-tokens:
          filters:
            branches:
              only:
                - test/circleci-oidc-denial-20261102
