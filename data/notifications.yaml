- id: influxdb-v2-9-token-hashing-default
  level: note
  scope:
    - /influxdb/v2/
  title: 'InfluxDB OSS 2.9.0: API tokens are hashed by default'
  slug: |
    Stronger token security in **InfluxDB OSS 2.9.0** — tokens are
    hashed on disk by default. Existing tokens are hashed on first
    startup and can't be recovered afterward. **Capture any plaintext
    tokens you still need before you upgrade.**

    [View InfluxDB OSS 2.9.0 release notes](/influxdb/v2/reference/release-notes/influxdb/#v290)
  message: |
    Hashed tokens authenticate exactly like unhashed tokens — clients
    and integrations keep working.

    **Also new in 2.9.0:**

    - Configurable backup compression
    - Restore support for backups containing hashed tokens
    - Tighter Edge Data Replication queue validation
    - Flux upgrade
    - Compaction reliability improvements

- id: explorer-1-9-key-enhancements
  level: note
  scope:
    - /
    - /influxdb3/explorer/
    - /influxdb3/core/
    - /influxdb3/enterprise/
  title: Key enhancements in Explorer 1.9
  slug: |
    Explorer 1.9 is now available with InfluxQL support, an AI-assisted
    Flux to SQL converter (beta), and new live sample data simulators.

    <a class="btn" href="/influxdb3/explorer/release-notes/#v190">View Explorer 1.9 release notes</a>
  message: |
    Explorer 1.9 includes new features and improvements that make it easier to
    query, visualize, and manage data.

    **Highlights:**

    - **Flux to SQL converter (beta)**: Convert Flux queries to SQL with an AI-assisted converter.
    - **InfluxQL support**: Query data with InfluxQL in the Data Explorer and dashboards, and save and load InfluxQL queries.
    - **InfluxQL visualizations**: Render line and bar charts from InfluxQL results with per-tag series grouping.
    - **Query error history**: Review a history of query errors in the query tool.
    - **Live sample data simulators**: Generate continuous live sample data with new bird data and signal generator simulators.

    For more details, see [Explorer 1.9 release notes](/influxdb3/explorer/release-notes/#v190)

- id: influxdb3-11-core-release
  level: note
  scope:
    - /influxdb3/core/
  title: 'InfluxDB 3.11 is now available'
  slug: |
    InfluxDB 3 Core 3.11 improves processing engine trigger reliability and
    adds a configurable graceful shutdown.
  message: |
    **Key updates in InfluxDB 3 Core 3.11:**

    - **Processing engine trigger reliability improvements**—capped async
      trigger concurrency, bounded retries for failed triggers, and WAL
      triggers that skip empty flushes.
    - **Configurable graceful shutdown** with the new `--shutdown-timeout` option.

    - [Read the announcement](https://www.influxdata.com/blog/influxdb-3-11/)
    - [InfluxDB 3 Core release notes](/influxdb3/core/release-notes/)

- id: influxdb3-11-enterprise-release
  level: note
  scope:
    - /influxdb3/
    - /influxdb3/enterprise/
  exclude:
    - /influxdb3/core/
    - /influxdb3/explorer/
    - /influxdb3/cloud/
    - /influxdb3/cloud-dedicated/
    - /influxdb3/cloud-serverless/
    - /influxdb3/clustered/
  title: 'InfluxDB 3 Enterprise 3.11: A significant performance upgrade for complex time series workloads'
  slug: |
    Performance and flexibility for heavier, more complex workloads.
  message: |
    **Key updates in InfluxDB 3 Enterprise 3.11:**

    - **Upgraded storage engine** reaches general availability. New
      clusters default to Parquet; upgrade with `--upgrade-pacha-tree`.
    - **In-place and incremental backup and restore**.
    - **Integrated Explorer UI**—run with `--mode all,webui`.
    - **Bulk import**: import from remote object store sources (for
      example, S3) with configurable concurrency.
    - **Compaction and query performance improvements**.
    - **Catalog migration**—back up your catalog before upgrading.

    - [Read the announcement](https://www.influxdata.com/blog/influxdb-3-11/)
    - [InfluxDB 3 Enterprise release notes](/influxdb3/enterprise/release-notes/)

- id: telegraf-controller-1-1
  level: note
  scope:
    - /
  exclude:
    - /platform/
    - /resources/
    - /kapacitor/
    - /chronograf/
    - /enterprise_influxdb/
    - /influxdb3/
    - /influxdb/
    - /flux/
  title: Telegraf Controller 1.1 now available
  slug: |
    Telegraf Controller 1.1 adds high availability _(Telegraf Enterprise)_,
    global constants, configuration groups, configuration aliases, and
    configuration versioning.
  message: |
    Telegraf Controller 1.1 lets teams make fleet-wide configuration changes
    with a single edit using
    [global constants](/telegraf/controller/configs/constants/),
    [configuration groups](/telegraf/controller/config-groups/), and
    [configuration aliases](/telegraf/controller/configs/aliases/).
    [Configuration versioning](/telegraf/controller/configs/versions/) makes
    every change traceable, comparable, and reversible.
    [High availability](/telegraf/controller/high-availability/), available with
    Telegraf Enterprise, automatically fails over between Controller instances
    so agents can continue pulling configurations and reporting health if an
    instance goes down.

    - [Read the announcement](https://influxdata.com/blog/telegraf-controller-1-1/)
    - [See the release notes](/telegraf/controller/reference/release-notes/#v110)
    - [Download and install Telegraf Controller 1.1](/telegraf/controller/install/)

- id: influxdb-v1-13-release
  level: note
  scope:
    - /influxdb/v1/
  title: 'InfluxDB OSS 1.13.0 is now available'
  slug: |
    InfluxDB OSS 1.13.0 adds mTLS support, adaptive TSI cache sizing, and
    a hardening option to mitigate SSRF.

    [View InfluxDB OSS 1.13.0 release notes](/influxdb/v1/about_the_project/release-notes/#v1130)
  message: |
    **Key updates in InfluxDB OSS 1.13.0:**

    - **mTLS support** for the HTTP, OpenTSDB, and subscriber services.
    - **Adaptive TSI cache sizing**—the series ID set cache can grow and
      shrink based on measured query hit rate.
    - **`hardening-enabled`** option to mitigate server-side request
      forgery (SSRF) in Flux HTTP requests.

    For details, see the
    [InfluxDB OSS 1.13.0 release notes](/influxdb/v1/about_the_project/release-notes/#v1130).

