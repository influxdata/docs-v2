# Notification data structure
#
# - id: unique ID for notification, cannot start with digit, no spaces, a-z and 0-9
#   level: note or warn
#   scope:
#     - list of URL paths to show the notification on, no scope shows everywhere
#   exclude:
#     - list of URL paths to not show the notification on
#   title_tag: (optional) Tag to include before the notification title
#   title: Message title
#   slug: (optional) Short notification summary
#   message: |
#     Markdown message content.
#
# Length limits (the panel is 450px wide and shares the viewport with the page):
#
# - title: one line, about 50 characters. Put the product and version first.
# - slug: one or two sentences, about 30 words. Always visible, so put any
#   action the reader must take here.
# - message: at most 4 short bullets (one line each) plus one line of links.
#   Don't repeat the slug. Put details in release notes or guides and link
#   to them; a notification is not a release summary.

# - id: future-of-flux-new
#   level: note
#   scope:
#     - /flux/v0
#     - /influxdb/v1/flux/
#     - /influxdb/v2/query-data/get-started/
#     - /influxdb/cloud/query-data/get-started/
#   exclude:
#     - /flux/v0/future-of-flux/
#   title: The future of Flux
#   slug: |
#     Flux is going into maintenance mode. You can continue using it as you
#     currently are without any changes to your code.
#
#     [Read more](/flux/v0/future-of-flux)
#   message: |
#     Flux is going into maintenance mode and will not be supported in InfluxDB 3.0.
#     This was a decision based on the broad demand for SQL and the continued growth
#     and adoption of InfluxQL. We are continuing to support Flux for users in 1.x
#     and 2.x so you can continue using it with no changes to your code.
#     If you are interested in transitioning to InfluxDB 3.0 and want to
#     future-proof your code, we suggest using InfluxQL.
#
#     For information about the future of Flux, see the following:
#
#     - [The plan for InfluxDB 3.0 Open Source](https://influxdata.com/blog/the-plan-for-influxdb-3-0-open-source)
#     - [InfluxDB 3.0 benchmarks](https://influxdata.com/blog/influxdb-3-0-is-2.5x-45x-faster-compared-to-influxdb-open-source/)

- id: influxdb-v2-9-token-hashing-default
  level: note
  scope:
    - /influxdb/v2/
  title: 'InfluxDB OSS 2.9.0: API tokens are hashed by default'
  slug: |
    Stronger token security in **InfluxDB OSS 2.9.0** — tokens are
    hashed on disk by default. Existing tokens are hashed on first
    startup and can't be recovered afterward. **Capture any plaintext
    tokens you still need before you upgrade.**

    [View InfluxDB OSS 2.9.0 release notes](/influxdb/v2/reference/release-notes/influxdb/#v290)
  message: |
    Hashed tokens authenticate exactly like unhashed tokens — clients
    and integrations keep working.

    **Also new in 2.9.0:**

    - Configurable backup compression
    - Restore support for backups containing hashed tokens
    - Tighter Edge Data Replication queue validation
    - Flux upgrade
    - Compaction reliability improvements

- id: explorer-1-11-key-enhancements
  level: note
  scope:
    - /
    - /influxdb3/explorer/
    - /influxdb3/core/
    - /influxdb3/enterprise/
  title: Explorer 1.11 is now available
  slug: |
    Six new visualization types, plus password and SSO sign-in and user
    management for InfluxDB 3 Enterprise.
  message: |
    - **Password and SSO sign-in** with role-based access.
    - **Manage Users** page under a new **Security** section.
    - **New visualizations**: Area, Single Stat, Gauge, Pie, Scatter, and Ranking.
    - **`EXPLAIN` and `EXPLAIN ANALYZE`** in the SQL editor.

    [Explorer 1.11 release notes](/influxdb3/explorer/release-notes/#v1110)

- id: influxdb3-12-core-release
  level: note
  scope:
    - /influxdb3/core/
  title: 'InfluxDB 3.12 is now available'
  slug: |
    **Back up your catalog before you upgrade.** Rolling back to 3.11.x
    requires restoring that backup.
  message: |
    - **Add columns to existing tables** with `influxdb3 update table`.
    - **Faster queries and startup** with DataFusion 52.5.
    - **New defaults**: finite `--max-concurrent-queries` and an enforced
      WAL buffer limit.

    [Upgrade guide](/influxdb3/core/admin/upgrade/) |
    [Release notes](/influxdb3/core/release-notes/) |
    [Announcement](https://www.influxdata.com/blog/influxdb-3-12/)

- id: influxdb3-12-enterprise-release
  level: note
  scope:
    - /influxdb3/
    - /influxdb3/enterprise/
  exclude:
    - /influxdb3/core/
    - /influxdb3/explorer/
    - /influxdb3/cloud/
    - /influxdb3/cloud-dedicated/
    - /influxdb3/cloud-serverless/
    - /influxdb3/clustered/
  title: 'InfluxDB 3 Enterprise 3.12 is now available'
  slug: |
    **Back up your catalog before you upgrade.** Rolling back to 3.11.x
    requires restoring that backup.
  message: |
    - **Faster bulk import**, including from object storage.
    - **Distributed compaction** (beta).
    - **Schema enforcement** per database.
    - **User authentication and RBAC** are generally available.

    [Upgrade guide](/influxdb3/enterprise/admin/upgrade/) |
    [Release notes](/influxdb3/enterprise/release-notes/) |
    [Announcement](https://www.influxdata.com/blog/influxdb-3-12/)

- id: telegraf-controller-1-1
  level: note
  scope:
    - /
  exclude:
    - /platform/
    - /resources/
    - /kapacitor/
    - /chronograf/
    - /enterprise_influxdb/
    - /influxdb3/
    - /influxdb/
    - /flux/
  title: Telegraf Controller 1.1 now available
  slug: |
    Telegraf Controller 1.1 adds high availability _(Telegraf Enterprise)_,
    global constants, configuration groups, configuration aliases, and
    configuration versioning.
  message: |
    Telegraf Controller 1.1 lets teams make fleet-wide configuration changes
    with a single edit using
    [global constants](/telegraf/controller/configs/constants/),
    [configuration groups](/telegraf/controller/config-groups/), and
    [configuration aliases](/telegraf/controller/configs/aliases/).
    [Configuration versioning](/telegraf/controller/configs/versions/) makes
    every change traceable, comparable, and reversible.
    [High availability](/telegraf/controller/high-availability/), available with
    Telegraf Enterprise, automatically fails over between Controller instances
    so agents can continue pulling configurations and reporting health if an
    instance goes down.

    - [Read the announcement](https://influxdata.com/blog/telegraf-controller-1-1/)
    - [See the release notes](/telegraf/controller/reference/release-notes/#v110)
    - [Download and install Telegraf Controller 1.1](/telegraf/controller/install/)

- id: influxdb-v1-13-release
  level: note
  scope:
    - /influxdb/v1/
  title: 'InfluxDB OSS 1.13.0 is now available'
  slug: |
    InfluxDB OSS 1.13.0 adds mTLS support, adaptive TSI cache sizing, and
    a hardening option to mitigate SSRF.

    [View InfluxDB OSS 1.13.0 release notes](/influxdb/v1/about_the_project/release-notes/#v1130)
  message: |
    **Key updates in InfluxDB OSS 1.13.0:**

    - **mTLS support** for the HTTP, OpenTSDB, and subscriber services.
    - **Adaptive TSI cache sizing**—the series ID set cache can grow and
      shrink based on measured query hit rate.
    - **`hardening-enabled`** option to mitigate server-side request
      forgery (SSRF) in Flux HTTP requests.

    For details, see the
    [InfluxDB OSS 1.13.0 release notes](/influxdb/v1/about_the_project/release-notes/#v1130).

