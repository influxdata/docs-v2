<aside class="api-toc" data-page-rail data-component="page-toc" data-toc-depth="{{ .Page.Params.toc_depth | default 2 }}" aria-label="On this page">
  <button class="page-toc-toggle" type="button" hidden aria-expanded="false" aria-controls="page-toc-navigation">
    <span class="page-toc-toggle-icon">{{ partialCached "lucide.html" (dict "icon" "panel-right-open") "panel-right-open" }}</span>
    <span class="page-toc-toggle-label">On this page</span>
  </button>
  <h4 class="api-toc-header">On this page</h4>
  <nav class="api-toc-nav" id="page-toc-navigation">
    {{ range .Operations }}
    {{ $anchor := printf "#operation/%s" .operationId }}
    <a href="{{ $anchor | safeURL }}" class="api-toc-link api-toc-link--operation">
      <span class="api-method api-method--{{ lower .method }} api-method--small">{{ upper .method }}</span>
      <span class="api-toc-summary">{{ with .summary }}{{ . }}{{ else }}{{ .path }}{{ end }}</span>
    </a>
    {{ end }}
  </nav>
</aside>
