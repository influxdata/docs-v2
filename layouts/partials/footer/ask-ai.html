<form class="ask-ai-composer" data-component="ask-ai" aria-label="Ask AI">
  <label class="sr-only" for="chat-assistant-textarea"
    >Ask a question about InfluxDB</label
  >
  <textarea
    id="chat-assistant-textarea"
    placeholder="Ask AI..."
    rows="2"
  ></textarea>
  <button
    type="submit"
    data-ask-ai-action="submit"
    aria-label="Send question"
    disabled
  >
    Send
  </button>
  <span role="status" aria-live="polite"></span>
</form>
